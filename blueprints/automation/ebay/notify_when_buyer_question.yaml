blueprint:
  name: eBay - Notify when a buyer question arrives
  description: >
    Send a notification when a new buyer question conversation is detected.

    Requires Messages to be enabled in eBay options and the
    **Seller ops activity** event entity.
  domain: automation
  source_url: https://github.com/andrewtryder/ha-ebay/blob/main/blueprints/automation/ebay/notify_when_buyer_question.yaml
  author: ha-ebay
  homeassistant:
    min_version: 2026.3.0
  input:
    seller_ops_event:
      name: Seller ops activity event
      description: Usually event.ebay_seller_ops_activity
      selector:
        entity:
          filter:
            - domain: event
              integration: ebay
    notify_entity:
      name: Notify entity
      description: Notify entity that supports notify.send_message
      selector:
        entity:
          domain: notify
    notification_title:
      name: Notification title
      default: eBay buyer question
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input seller_ops_event

conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type == 'new_buyer_question' }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_entity
    data:
      title: !input notification_title
      message: >-
        New buyer question{%
          if trigger.to_state.attributes.subject or trigger.to_state.attributes.title
        %}: {{ trigger.to_state.attributes.subject | default(trigger.to_state.attributes.title) }}{% endif
        %}{% if trigger.to_state.attributes.conversation_id is defined and trigger.to_state.attributes.conversation_id
        %} ({{ trigger.to_state.attributes.conversation_id }}){% endif %}
