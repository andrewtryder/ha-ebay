blueprint:
  name: eBay - Notify when price drops below target
  description: >
    Send a notification when a watched item crosses below a configured price
    target.

    Configure global or per-item price-drop targets in the eBay integration
    options. Requires the eBay **Watching activity** event entity.
  domain: automation
  source_url: https://github.com/andrewtryder/ha-ebay/blob/main/blueprints/automation/ebay/notify_when_price_drops_below_target.yaml
  author: ha-ebay
  homeassistant:
    min_version: 2026.3.0
  input:
    watching_event:
      name: Watching activity event
      description: Usually event.ebay_watching_activity
      selector:
        entity:
          filter:
            - domain: event
              integration: ebay
    notify_entity:
      name: Notify entity
      description: Notify entity that supports notify.send_message
      selector:
        entity:
          domain: notify
    notification_title:
      name: Notification title
      default: eBay price drop
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input watching_event

conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type == 'watched_item_price_dropped_below' }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_entity
    data:
      title: !input notification_title
      message: >-
        {{ trigger.to_state.attributes.title | default('Watched item') }} dropped
        to {{ trigger.to_state.attributes.new_value | default(trigger.to_state.attributes.price) }}{%
          if trigger.to_state.attributes.currency %} {{ trigger.to_state.attributes.currency }}{% endif
        %}{% if trigger.to_state.attributes.threshold is defined and trigger.to_state.attributes.threshold is not none
        %} (target {{ trigger.to_state.attributes.threshold }}{%
          if trigger.to_state.attributes.threshold_currency %} {{ trigger.to_state.attributes.threshold_currency }}{% endif
        %}){% endif %}{%
        if trigger.to_state.attributes.url %}
        {{ trigger.to_state.attributes.url }}{% endif %}
