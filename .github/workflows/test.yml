name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (HA 2026.10.0)
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        # astral-sh/setup-uv@v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify Home Assistant version
        run: |
          uv run --locked python -c "import homeassistant.const, importlib.metadata; v1 = homeassistant.const.__version__; v2 = importlib.metadata.version('homeassistant'); print(f'Installed HA: const={v1}, metadata={v2}'); assert v1 == '2026.10.0' and v2 == '2026.10.0', (v1, v2)"

      - name: Pre-commit (all files)
        run: uv run --locked pre-commit run --all-files

      - name: Ruff check
        run: uv run --locked ruff check . --output-format=github

      - name: Ruff format verification
        run: uv run --locked ruff format --check .

      - name: Compile
        run: uv run --locked python -m compileall custom_components scripts tests

      - name: Tests with coverage
        run: uv run --locked pytest -q
