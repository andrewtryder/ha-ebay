name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (HA ${{ matrix.ha-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared HACS minimum is 2026.3.0; first published harness on that
          # train is 0.13.317 → homeassistant==2026.3.1.
          - python-version: "3.14"
            ha-label: "2026.3.1-minimum"
            requirements-ha: requirements-ha-min.txt
          - python-version: "3.14"
            ha-label: "2026.7.2-current"
            requirements-ha: requirements-ha-current.txt

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest pytest-cov ruff pillow
          fi
          if [ -f "${{ matrix.requirements-ha }}" ]; then
            python -m pip install -r "${{ matrix.requirements-ha }}"
          else
            python -m pip install pytest-homeassistant-custom-component
          fi

      - name: Pre-commit (all files)
        if: matrix.ha-label == '2026.7.2-current'
        run: pre-commit run --all-files

      - name: Ruff
        run: |
          if [ -d custom_components ]; then
            paths=(custom_components)
            if [ -d tests ]; then
              paths+=(tests)
            fi
            ruff check "${paths[@]}" --output-format=github
          else
            echo "No custom_components directory yet; skipping ruff."
          fi

      - name: Compile
        run: |
          if [ -d custom_components ]; then
            python -m compileall custom_components
          else
            echo "No custom_components directory yet; skipping compileall."
          fi

      - name: Tests with coverage
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory yet; skipping pytest."
          fi
