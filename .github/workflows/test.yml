name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (HA ${{ matrix.ha-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current published phcc/HA pin (2026.2.3). Add a second include
          # entry for the declared HACS minimum (2026.3.0) once available on PyPI.
          - python-version: "3.13"
            ha-label: "2026.2.3-current"
            requirements-ha: requirements-ha.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest pytest-cov ruff pillow
          fi
          if [ -f "${{ matrix.requirements-ha }}" ]; then
            python -m pip install -r "${{ matrix.requirements-ha }}"
          else
            python -m pip install pytest-homeassistant-custom-component
          fi

      - name: Ruff
        run: |
          if [ -d custom_components ]; then
            paths=(custom_components)
            if [ -d tests ]; then
              paths+=(tests)
            fi
            ruff check "${paths[@]}" --output-format=github
          else
            echo "No custom_components directory yet; skipping ruff."
          fi

      - name: Compile
        run: |
          if [ -d custom_components ]; then
            python -m compileall custom_components
          else
            echo "No custom_components directory yet; skipping compileall."
          fi

      - name: Tests with coverage
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory yet; skipping pytest."
          fi
