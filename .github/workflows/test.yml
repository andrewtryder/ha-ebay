name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest pytest-cov ruff pillow
          fi
          if [ -f requirements-ha.txt ]; then
            python -m pip install -r requirements-ha.txt
          else
            python -m pip install pytest-homeassistant-custom-component
          fi

      - name: Ruff
        run: |
          if [ -d custom_components ]; then
            paths=(custom_components)
            if [ -d tests ]; then
              paths+=(tests)
            fi
            ruff check "${paths[@]}" --output-format=github
          else
            echo "No custom_components directory yet; skipping ruff."
          fi

      - name: Compile
        run: |
          if [ -d custom_components ]; then
            python -m compileall custom_components
          else
            echo "No custom_components directory yet; skipping compileall."
          fi

      - name: Tests with coverage
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory yet; skipping pytest."
          fi
