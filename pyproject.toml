[project]
name = "ha-ebay"
version = "0.8.3"
description = "Home Assistant custom integration for eBay buying, bidding, and selling activity."
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [
    { name = "Andrew Ryder" }
]
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.371",
    "homeassistant==2026.10.0",
    "voluptuous-serialize>=2.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff==0.16.0",
    "pre-commit>=4.0.0",
    "pillow>=10.0.0",
    "aiohttp>=3.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=custom_components/ebay",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["custom_components/ebay"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
