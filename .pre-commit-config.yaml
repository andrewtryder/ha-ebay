# Install once: pip install -r requirements-dev.txt && pre-commit install --hook-types pre-commit --hook-types pre-push
# Commit hooks: fast lint/format/file hygiene. Push hooks: full pytest with coverage.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        name: ruff check
        args: [custom_components, tests]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        args: [custom_components, tests]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^blueprints/
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pytest
        name: pytest with coverage
        language: system
        entry: bash -c 'if [ -x .venv/bin/python ]; then exec .venv/bin/python -m pytest -q; else exec python -m pytest -q; fi'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
