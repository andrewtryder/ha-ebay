[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --cov=custom_components/ebay
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
branch = False
source = custom_components/ebay

[coverage:report]
show_missing = True
skip_covered = False
